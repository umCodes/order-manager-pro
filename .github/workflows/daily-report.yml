# Sends the daily report on WhatsApp every morning, just after the business
# day ends (4am, UTC+3), by calling the backend's scheduled endpoint.
# The backend may be asleep (Render's free plan): the call is retried until
# it wakes. Each day is sent once at most — the backend skips a day that was
# already sent — so a retry or a manual run never sends it twice.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DAILY_REPORT_URL  e.g. https://<backend>.onrender.com/api/reports/daily/scheduled
#   CRON_SECRET       the same value as the backend's CRON_SECRET
name: Daily report

on:
  schedule:
    # 01:05 UTC = 04:05 business time (UTC+3). GitHub may start it a few minutes late.
    - cron: "5 1 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call the scheduled daily report endpoint
        env:
          URL: ${{ secrets.DAILY_REPORT_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Set the DAILY_REPORT_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$URL" \
              -H "X-Cron-Secret: $SECRET" \
              -H "Accept: application/json" \
              -H "User-Agent: daily-report-action" \
              --max-time 120 || echo "000")
            echo "Attempt $attempt: HTTP $status — $(head -c 300 response.txt 2>/dev/null)"
            case "$status" in
              200|202) exit 0 ;;                                   # sending, or already sent
              400|401|503) echo "::error::$(head -c 300 response.txt)"; exit 1 ;;  # needs fixing in Settings or on the server
            esac
            # Server still waking (timeout, 502/503 from Render, a loading page…): try again shortly.
            sleep 30
          done
          echo "::error::The backend didn't answer after 12 attempts"
          exit 1
