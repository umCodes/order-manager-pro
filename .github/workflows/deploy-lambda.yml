# Deploys the webhook Lambda (wa-webhook-lambda/) whenever its code changes on
# the branch below, or on demand from the Actions tab: installs its
# dependencies, zips it the same way `npm run package` does, and uploads it.
# The Lambda's environment variables are left as they are.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  an IAM user allowed
#       lambda:UpdateFunctionCode, lambda:GetFunction and
#       lambda:GetFunctionConfiguration (to wait for the update) on the function
#   AWS_REGION            e.g. eu-north-1
#   LAMBDA_FUNCTION_NAME  the function's name
name: Deploy webhook Lambda

on:
  push:
    # The branch the Lambda runs from. Switch to main once this work is merged.
    branches: [claude/daily-report]
    paths:
      - "wa-webhook-lambda/**"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch: {}

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-lambda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wa-webhook-lambda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secrets are set
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION LAMBDA_FUNCTION_NAME; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name repository secret"; exit 1; fi
          done

      - name: Build the package
        run: npm run package

      - name: Check the package has its dependencies
        run: unzip -l function.zip | grep -q "node_modules/ioredis/" || { echo "::error::function.zip has no node_modules"; exit 1; }

      - name: Upload to the Lambda
        env:
          RAW_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAW_REGION: ${{ secrets.AWS_REGION }}
          RAW_FUNCTION: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          # Pasted secrets often carry a stray space or line break, which AWS
          # rejects as a bad signature: none of these values has any.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          export AWS_ACCESS_KEY_ID="$(clean "$RAW_KEY_ID")"
          export AWS_SECRET_ACCESS_KEY="$(clean "$RAW_SECRET")"
          export AWS_DEFAULT_REGION="$(clean "$RAW_REGION")"
          FUNCTION="$(clean "$RAW_FUNCTION")"
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://function.zip --query '{version: Version, size: CodeSize, sha: CodeSha256}'
          aws lambda wait function-updated --function-name "$FUNCTION"
          echo "Deployed $FUNCTION"
